name: WG-Gesucht Alert Bot

on:
  schedule:
    - cron: '*/10 * * * *' # هر ۱۰ دقیقه یک‌بار اجرا می‌شود
  workflow_dispatch:       # دکمه اجرای دستی برای تست

permissions:
  contents: write

jobs:
  check-rooms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run WG-Gesucht checker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check.py

      - name: Save seen listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json || true
          git diff --staged --quiet || (git commit -m "Update seen listings" && git push)
